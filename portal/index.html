<style>
:root{
  --bg:#FAFAF7;--bg2:#F4F1EB;--bg3:#EAE5DA;--dark:#0C0A06;--dark2:#1A1610;
  --text:#1A1610;--text2:#5C5545;--text3:#8A826F;--acc:#C6993B;--acc2:#D4A642;--accBg:#FDF6EA;--accBg2:#F5E8CC;
  --green:#2A6B3E;--greenBg:#E6F2EA;--red:#C0392B;--redBg:#FBEAE8;--blue:#2C5F8A;--blueBg:#E8F0F7;--orange:#D97706;--orangeBg:#FEF3E2;
  --white:#FFFFFF;--fh:'Bricolage Grotesque',sans-serif;--fb:'Instrument Sans',sans-serif;
  --sidebar-w:240px;--radius:14px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--text);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none !important}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(198,153,59,.12),transparent 70%);top:-150px;left:-100px;border-radius:50%}
.auth-wrap::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(198,153,59,.08),transparent 70%);bottom:-150px;right:-100px;border-radius:50%}
.auth-card{background:var(--bg);border-radius:24px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.auth-logo{font-family:var(--fh);font-size:26px;font-weight:800;letter-spacing:-.04em;margin-bottom:4px}
.auth-logo span{color:var(--acc)}
.auth-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--accBg);padding:4px 10px;border-radius:100px;margin-bottom:24px}
.auth-h{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--text3);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1px solid var(--bg3);border-radius:9px;font-size:14px;background:#fff;transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accBg)}
.btn-primary{width:100%;padding:13px;background:var(--dark);color:#fff;border-radius:10px;font-size:15px;font-weight:600;transition:all .2s}
.btn-primary:hover{background:var(--dark2)}

/* SHELL */
.app{display:none;min-height:100vh}
.app.active{display:grid;grid-template-columns:var(--sidebar-w) 1fr}
.sidebar{background:var(--dark);padding:24px 16px;display:flex;flex-direction:column;position:fixed;width:var(--sidebar-w);height:100vh;overflow-y:auto}
.sb-logo{font-family:var(--fh);font-size:22px;font-weight:800;color:#fff;letter-spacing:-.04em;padding:0 8px 6px}
.sb-logo span{color:var(--acc)}
.sb-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding:0 8px 24px}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.25);padding:16px 12px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;color:rgba(255,255,255,.55);transition:all .15s}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.active{background:rgba(198,153,59,.15);color:var(--acc)}
.sb-item svg{width:18px;height:18px;flex-shrink:0}
.sb-item-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:100px}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:16px;margin-top:16px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sb-user-name{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.sb-user-email{font-size:11px;color:rgba(255,255,255,.4)}
.sb-logout{margin-left:auto;color:rgba(255,255,255,.4);padding:4px}
.sb-logout:hover{color:#fff}

.main{grid-column:2;min-height:100vh}
.topbar{background:rgba(250,250,247,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bg3);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:-.03em}
.topbar-sub{font-size:13px;color:var(--text3);margin-top:1px}
.btn-icon{width:38px;height:38px;border-radius:9px;border:1px solid var(--bg3);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s}
.btn-icon:hover{border-color:var(--text3);color:var(--dark)}
.btn-acc{padding:10px 18px;background:var(--acc);color:var(--dark);border-radius:9px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;transition:all .2s}
.btn-acc:hover{background:var(--acc2)}
.content{padding:28px 32px 48px}
.page{display:none}.page.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}


.limit-panel{background:var(--card,#fff);border:1px solid rgba(12,10,6,.09);border-radius:16px;padding:18px 20px;margin-bottom:22px}
.limit-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.limit-h-t{font-size:15px;font-weight:700;color:var(--dark)}
.limit-count{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:rgba(216,31,38,.1);color:#D81F26}
.limit-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(12,10,6,.06)}
.limit-row:first-of-type{border-top:none}
.limit-logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.limit-info{flex:1;min-width:0}
.limit-nm{font-size:13.5px;font-weight:700;color:var(--dark)}
.limit-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
.limit-pct{font-size:15px;font-weight:800;flex-shrink:0}
.limit-act{flex-shrink:0;padding:6px 12px;border-radius:8px;border:1px solid rgba(12,10,6,.14);background:transparent;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;color:var(--dark)}
.limit-empty{font-size:13px;color:var(--text3);padding:10px 0}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--bg3);border-radius:var(--radius);padding:20px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.kpi-ic.gold{background:var(--accBg)}.kpi-ic.green{background:var(--greenBg)}.kpi-ic.blue{background:var(--blueBg)}.kpi-ic.orange{background:var(--orangeBg)}.kpi-ic.red{background:var(--redBg)}.kpi-ic.dark{background:var(--bg2)}
.kpi-trend{font-size:12px;font-weight:700;padding:3px 8px;border-radius:100px}
.kpi-trend.up{background:var(--greenBg);color:var(--green)}
.kpi-trend.down{background:var(--redBg);color:var(--red)}
.kpi-v{font-family:var(--fh);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kpi-l{font-size:13px;color:var(--text3);margin-top:6px}

.card{background:#fff;border:1px solid var(--bg3);border-radius:var(--radius);padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:-.02em}
.card-sub{font-size:12px;color:var(--text3);margin-top:1px}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* MRR area chart */
.area-chart{position:relative;height:200px;margin-top:10px}
.area-svg{width:100%;height:100%;overflow:visible}
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:20px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc));position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.chart-lbl{font-size:11px;color:var(--text3);font-weight:600}
.chart-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}

.donut-wrap{display:flex;align-items:center;gap:24px}
.donut{width:140px;height:140px;flex-shrink:0;border-radius:50%;overflow:hidden;background:#fff}
.legend{display:flex;flex-direction:column;gap:12px;flex:1}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-val{margin-left:auto;font-weight:700;font-family:var(--fh)}
.legend-sub{font-size:11px;color:var(--text3)}

.table-wrap{background:#fff;border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden}
.table-toolbar{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3);flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);width:16px;height:16px}
.search-box input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--bg3);border-radius:9px;font-size:14px;background:var(--bg)}
.search-box input:focus{outline:none;border-color:var(--acc);background:#fff}
.filter-chip{padding:8px 14px;border:1px solid var(--bg3);border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);background:#fff;transition:all .2s}
.filter-chip:hover,.filter-chip.active{border-color:var(--acc);background:var(--accBg);color:var(--acc)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 20px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--bg3);background:var(--bg)}
td{padding:14px 20px;border-bottom:1px solid var(--bg3);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--bg)}
.biz-cell{display:flex;align-items:center;gap:10px}
.biz-logo{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.biz-name{font-weight:600}
.biz-meta{font-size:12px;color:var(--text3)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600}
.tag.starter{background:var(--bg2);color:var(--text2)}
.tag.pro{background:var(--accBg);color:var(--acc)}
.tag.business{background:var(--dark);color:#fff}
.tag.active{background:var(--greenBg);color:var(--green)}
.tag.trial{background:var(--blueBg);color:var(--blue)}
.tag.risk{background:var(--orangeBg);color:var(--orange)}
.tag.churned{background:var(--redBg);color:var(--red)}
.row-action{padding:6px 12px;border:1px solid var(--bg3);border-radius:7px;font-size:13px;font-weight:600;color:var(--text2);background:#fff;transition:all .2s}
.row-action:hover{border-color:var(--acc);color:var(--acc)}
.mrr-cell{font-family:var(--fh);font-weight:700}
.usage-bar{width:70px;height:6px;background:var(--bg3);border-radius:100px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.usage-fill{height:100%;border-radius:100px}

.alert-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bg3)}
.alert-item:last-child{border-bottom:none}
.alert-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.alert-ic.warn{background:var(--orangeBg)}.alert-ic.red{background:var(--redBg)}.alert-ic.blue{background:var(--blueBg)}
.alert-t{font-size:14px;font-weight:600}
.alert-d{font-size:12px;color:var(--text3)}
.alert-time{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}

.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:300;display:flex;align-items:center;gap:10px;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast-ic{color:var(--acc)}

.menu-toggle{display:none}
@media(max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2b{grid-template-columns:1fr}}
@media(max-width:768px){
  .app.active{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%);transition:transform .3s;z-index:100}
  .sidebar.open{transform:translateX(0)}
  .main{grid-column:1}.kpi-grid{grid-template-columns:1fr}
  .content{padding:20px}.topbar{padding:14px 20px}.menu-toggle{display:flex}
}

<script>
// ===== API LAYER (mock — substituir por fetch reais) =====
const PLAN_PRICE_MAP = { Starter:35, Pro:69, Business:149 };
const PLAN_LIMIT_MAP = { Starter:500, Pro:5000, Business:1000000 };
function portalTimeAgo(iso){
  if(!iso) return '—';
  const d=new Date(iso),now=new Date(),days=Math.floor((now-d)/864e5);
  if(days<1) return 'hoje'; if(days===1) return 'ontem';
  if(days<7) return 'há '+days+' dias';
  if(days<30) return 'há '+Math.floor(days/7)+' semana(s)';
  if(days<365) return 'há '+Math.floor(days/30)+' mês(es)';
  return 'há '+Math.floor(days/365)+' ano(s)';
}
// Carrega todos os negócios + nº de clientes de cada (agregado real)
async function loadAllBusinesses(){
  const { data: bizs, error } = await db.from('businesses').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); return []; }
  // contar clientes por negócio
  const out = [];
  for(const b of bizs){
    const { count } = await db.from('customers').select('*',{count:'exact',head:true}).eq('business_id', b.id);
    out.push({
      id:b.id, name:b.name, owner:b.owner_name||'—', city:b.city||'—',
      plan:b.plan, status:b.status, mrr: b.status==='active'?(PLAN_PRICE_MAP[b.plan]||0):0,
      customers: count||0, limit: (PLAN_LIMIT_MAP[b.plan]||500), isDemo: !!b.is_demo,
      usage: Math.round(((count||0)/(PLAN_LIMIT_MAP[b.plan]||500))*100),
      isFounder: !!b.is_founder,
      joined: portalTimeAgo(b.created_at), color:b.brand_color||'#C6993B'
    });
  }
  return out;
}
const API = {
  async getBusinesses(){ return await loadAllBusinesses(); },
  async getMetrics(){
    const all = await loadAllBusinesses();
    const bizs = all.filter(b=>!b.isDemo);
    const active = bizs.filter(b=>b.status==='active');
    const trial = bizs.filter(b=>b.status==='trial');
    const mrr = active.reduce((s,b)=>s+b.mrr,0);
    const arpu = active.length ? (mrr/active.length) : 0;
    const churned = bizs.filter(b=>b.status==='churned').length;
    const churn = bizs.length ? ((churned/bizs.length)*100) : 0;
    return {
      mrr, mrrTrend:14, activeBiz:active.length, bizTrend:9,
      trial:trial.length, churn:Number(churn.toFixed(1)), churnTrend:-0.4,
      arpu:Number(arpu.toFixed(1)), demos: all.filter(b=>b.isDemo).length
    };
  },
  async getAlerts(){
    const bizs = await loadAllBusinesses();
    const alerts = [];
    bizs.filter(b=>b.status==='trial').forEach(b=>
      alerts.push({type:'blue',icon:'⏳',t:b.name+' — em trial',d:b.customers+' clientes · uso '+b.usage+'%',time:b.plan}));
    bizs.filter(b=>b.status==='risk').forEach(b=>
      alerts.push({type:'warn',icon:'⚠️',t:b.name+' em risco de churn',d:'uso baixo: '+b.usage+'%',time:b.plan}));
    bizs.filter(b=>b.status==='churned').forEach(b=>
      alerts.push({type:'red',icon:'✕',t:b.name+' cancelou a subscrição',d:'Era '+b.plan,time:portalTimeAgo(null)}));
    return alerts;
  }
};

// ===== AUTH =====
async function doLogin(){
  const inputs=document.querySelectorAll('#auth input');
  const email=inputs[0].value.trim();
  const pass=inputs[1].value;
  const btn=event?event.target:null;
  if(btn){btn.disabled=true;btn.textContent='A entrar...';}
  // 1. Autenticar
  const { data:auth, error }=await db.auth.signInWithPassword({email,password:pass});
  if(error){ alert('Email ou palavra-passe incorretos.'); if(btn){btn.disabled=false;btn.textContent='Entrar no portal →';} return; }
  // 2. Verificar se é admin da plataforma
  const { data:admin }=await db.from('platform_admins').select('*').eq('auth_user_id',auth.user.id).single();
  if(!admin){
    alert('Esta conta não tem acesso ao portal interno.');
    await db.auth.signOut();
    if(btn){btn.disabled=false;btn.textContent='Entrar no portal →';}
    return;
  }
  document.getElementById('auth').style.display='none';
  document.getElementById('app').classList.add('active');
  setPortalUser(admin.name, auth.user.email);
  await renderAll();
  if(btn){btn.disabled=false;btn.textContent='Entrar no portal →';}
}
function setPortalUser(name, email){
  const n=document.getElementById('sb-user-name'); if(n) n.textContent=name||'Equipa Loyalle';
  const e=document.getElementById('sb-user-email'); if(e) e.textContent=email||'';
  const av=document.querySelector('.sb-avatar'); if(av&&name) av.textContent=name[0].toUpperCase();
}
async function logout(){
  await db.auth.signOut();
  document.getElementById('app').classList.remove('active');
  document.getElementById('auth').style.display='flex';
}
// Sessão persistente
(async function checkPortalSession(){
  const { data }=await db.auth.getSession();
  if(data&&data.session){
    const { data:admin }=await db.from('platform_admins').select('*').eq('auth_user_id',data.session.user.id).single();
    if(admin){
      document.getElementById('auth').style.display='none';
      document.getElementById('app').classList.add('active');
      setPortalUser(admin.name, data.session.user.email);

})();

// ===== TOAST =====
function toast(m){ const t=document.getElementById('toast'); document.getElementById('toast-msg').textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

// ===== HELPERS =====
function eur(n){ return '€'+n.toLocaleString('pt-PT'); }
function donut(segs){
  const total=segs.reduce((a,b)=>a+b.value,0); let off=0;
  const circles=segs.map(s=>{const pct=(s.value/total)*100;const c=`<circle r="15.915" cx="18" cy="18" fill="transparent" stroke="${s.color}" stroke-width="5" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${-off}" transform="rotate(-90 18 18)"/>`;off+=pct;return c;}).join('');
  return {circles,total};
}

async function renderOverview(){
  const m=await API.getMetrics();
  const bizs=await API.getBusinesses();
  // Distribuição por plano (real)
  const planCounts={Starter:0,Pro:0,Business:0};
  bizs.filter(b=>!b.isDemo).forEach(b=>{ if(planCounts[b.plan]!==undefined) planCounts[b.plan]++; });
  DATA.planDist=[
    {label:'Starter',value:planCounts.Starter,price:35,color:'#C6993B'},
    {label:'Pro',value:planCounts.Pro,price:69,color:'#2A6B3E'},
    {label:'Business',value:planCounts.Business,price:149,color:'#0C0A06'}
  ].filter(s=>s.value>0);
  // MRR histórico: mostra o MRR atual como último ponto (histórico real virá com o tempo)
  DATA.mrrMonths=[{m:'Atual',v:m.mrr}];
  const maxV=Math.max(...DATA.mrrMonths.map(x=>x.v),1);
  const bars=DATA.mrrMonths.map(x=>{const h=Math.round((x.v/maxV)*100);return `<div class="chart-col"><div class="chart-bar" style="height:${h}%"><span class="chart-val">${eur(x.v)}</span></div><span class="chart-lbl">${x.m}</span></div>`;}).join('');
  const d=donut(DATA.planDist);
  const legend=DATA.planDist.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><div><div>${s.label}</div><div class="legend-sub">${eur(s.price)}/mês</div></div><span class="legend-val">${s.value}</span></div>`).join('');
  const alertsData=await API.getAlerts();
  const acts=alertsData.slice(0,5).map(a=>`<div class="alert-item"><div class="alert-ic ${a.type==='blue'?'blue':a.type==='red'?'red':'warn'}">${a.icon}</div><div><div class="alert-t" style="font-weight:500">${a.t}</div></div><div class="alert-time">${a.time}</div></div>`).join('') || '<div style="color:var(--text3);font-size:13px;padding:12px">Sem alertas de momento.</div>';

  // ---- Negócios perto ou acima do limite ----
  const nearLimit = bizs
    .filter(b => !b.isDemo && b.plan !== 'Business' && b.usage >= 80)
    .sort((a,b) => b.usage - a.usage);
  const overCount = nearLimit.filter(b => b.usage >= 100).length;
  const limitRows = nearLimit.length
    ? nearLimit.map(b => {
        const ini = b.name.split(' ').map(w=>w[0]).slice(0,2).join('');
        const col = b.usage >= 100 ? '#D81F26' : '#F7941D';
        const nextPlan = b.plan === 'Starter' ? 'Pro' : 'Business';
        return `<div class="limit-row">
          <div class="limit-logo" style="background:${b.color}">${ini}</div>
          <div class="limit-info">
            <div class="limit-nm">${b.name}</div>
            <div class="limit-sub">${b.customers.toLocaleString('pt-PT')} / ${b.limit.toLocaleString('pt-PT')} clientes · plano ${b.plan} → sugerir ${nextPlan}</div>
          </div>
          <div class="limit-pct" style="color:${col}">${b.usage}%</div>
          <button class="limit-act" onclick="toast('Contactar ${b.name}')">Contactar</button>
        </div>`;
      }).join('')
    : '<div class="limit-empty">Nenhum negócio perto do limite. Tudo folgado.</div>';
  const limitPanel = `<div class="limit-panel">
      <div class="limit-h">
        <span style="font-size:17px">\uD83D\uDCCA</span>
        <span class="limit-h-t">Limites de plano</span>
        ${overCount ? `<span class="limit-count">${overCount} acima do limite</span>` : ''}
        ${m.demos ? `<span style="margin-left:auto;font-size:11.5px;color:var(--text3)">${m.demos} negócio(s) demo excluído(s) das métricas</span>` : ''}
      </div>
      ${limitRows}
    </div>`;

  document.getElementById('page-overview').innerHTML = limitPanel + `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic gold">💰</div><div class="kpi-trend up">↑ ${m.mrrTrend}%</div></div><div class="kpi-v">${eur(m.mrr)}</div><div class="kpi-l">MRR (receita mensal)</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic green">🏪</div><div class="kpi-trend up">↑ ${m.bizTrend}%</div></div><div class="kpi-v">${m.activeBiz}</div><div class="kpi-l">Negócios ativos</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic blue">⏳</div></div><div class="kpi-v">${m.trial}</div><div class="kpi-l">Em trial</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic red">📉</div><div class="kpi-trend up">↓ ${Math.abs(m.churnTrend)}%</div></div><div class="kpi-v">${m.churn}%</div><div class="kpi-l">Churn mensal</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><div><div class="card-title">Crescimento do MRR</div><div class="card-sub">Últimos 7 meses · +${m.mrrTrend}% MoM</div></div></div><div class="chart-bars">${bars}</div></div>
      <div class="card"><div class="card-h"><div><div class="card-title">Distribuição por plano</div><div class="card-sub">${d.total} negócios pagantes</div></div></div><div class="donut-wrap"><svg class="donut" viewBox="0 0 36 36"><rect x="0" y="0" width="36" height="36" fill="#fff"/><circle r="15.915" cx="18" cy="18" fill="transparent" stroke="#f0ede8" stroke-width="5" stroke-dasharray="100 0" transform="rotate(-90 18 18)"/>${d.circles}<circle cx="18" cy="18" r="13" fill="#fff"/><text x="18" y="17" text-anchor="middle" style="font-family:var(--fh);font-size:7px;font-weight:800;fill:var(--dark)">${d.total}</text><text x="18" y="23" text-anchor="middle" style="font-size:3px;fill:var(--text3)">ativos</text></svg><div class="legend">${legend}</div></div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><div class="card-title">Atividade recente</div><button class="filter-chip" onclick="nav('activity',document.querySelectorAll('.sb-item')[4])">Ver tudo</button></div>${acts}</div>
      <div class="card"><div class="card-h"><div class="card-title">Destaques</div></div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div><div style="font-size:13px;color:var(--text3)">Receita média por negócio (ARPU)</div><div style="font-family:var(--fh);font-size:24px;font-weight:800">${eur(m.arpu)}</div></div>
          <div><div style="font-size:13px;color:var(--text3)">Conversão trial → pago</div><div style="font-family:var(--fh);font-size:24px;font-weight:800;color:var(--green)">64%</div></div>
          <div><div style="font-size:13px;color:var(--text3)">Total de clientes finais geridos</div><div style="font-family:var(--fh);font-size:24px;font-weight:800">15.4k</div></div>
        </div>
      </div>
    </div>`;
}

  if(bizSearch) list=list.filter(b=>b.name.toLowerCase().includes(bizSearch)||b.owner.toLowerCase().includes(bizSearch)||b.city.toLowerCase().includes(bizSearch));
  const rows=list.map(b=>{
    const initials=b.name.split(' ').map(w=>w[0]).slice(0,2).join('');
    const planTag=`<span class="tag ${b.plan.toLowerCase()}">${b.plan}</span>`;
    const statusTag=b.status==='active'?'<span class="tag active">Ativo</span>':b.status==='trial'?'<span class="tag trial">Trial</span>':b.status==='risk'?'<span class="tag risk">Em risco</span>':'<span class="tag churned">Cancelado</span>';
    const usageColor=b.usage>=100?'var(--red)':b.usage>=80?'var(--orange)':'var(--green)';
    return `<tr>
      <td><div class="biz-cell"><div class="biz-logo" style="background:${b.color}">${initials}</div><div><div class="biz-name">${b.name}</div><div class="biz-meta">${b.owner} · ${b.city}${b.isDemo?' · <span style="color:var(--text3);font-weight:700">DEMO</span>':''}${b.isFounder?' · <span style="color:var(--acc);font-weight:700">Fundador</span>':''}</div></div></div></td>
      <td>${planTag}</td>
      <td>${statusTag}</td>
      <td class="mrr-cell">${b.mrr?eur(b.mrr):'—'}</td>
      <td>${b.customers.toLocaleString('pt-PT')}</td>
      <td><div class="usage-bar"><div class="usage-fill" style="width:${Math.min(b.usage,100)}%;background:${usageColor}"></div></div><span style="font-size:13px;font-weight:600;color:${usageColor}">${b.usage}%</span>${b.plan!=="Business"?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${b.customers.toLocaleString("pt-PT")} / ${b.limit.toLocaleString("pt-PT")}</div>`:""}</td>

        <button class="filter-chip ${bizFilter==='business'?'active':''}" onclick="bizFilter='business';renderBusinesses()">Business</button>
      </div>
      <table>
        <thead><tr><th>Negócio</th><th>Plano</th><th>Estado</th><th>MRR</th><th>Clientes</th><th>Uso</th><th>Cliente desde</th><th></th></tr></thead>

      </table>
    </div>`;
}

async function renderRevenue(){
  const m=await API.getMetrics();

  const bars=DATA.mrrMonths.map(x=>{const h=Math.round((x.v/maxV)*100);return `<div class="chart-col"><div class="chart-bar" style="height:${h}%"><span class="chart-val">${eur(x.v)}</span></div><span class="chart-lbl">${x.m}</span></div>`;}).join('');
  const planRev=(DATA.planDist||[]).map(s=>({...s,rev:s.value*s.price}));
  const totalRev=planRev.reduce((a,b)=>a+b.rev,0);
  const planRows=planRev.map(s=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bg3)"><span class="legend-dot" style="background:${s.color};width:12px;height:12px"></span><div style="flex:1"><div style="font-weight:600">${s.label}</div><div style="font-size:12px;color:var(--text3)">${s.value} negócios × ${eur(s.price)}</div></div><div style="font-family:var(--fh);font-weight:800;font-size:18px">${eur(s.rev)}</div></div>`).join('');
  document.getElementById('page-revenue').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic gold">💰</div><div class="kpi-trend up">↑ ${m.mrrTrend}%</div></div><div class="kpi-v">${eur(m.mrr)}</div><div class="kpi-l">MRR atual</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic green">📅</div></div><div class="kpi-v">${eur(m.mrr*12)}</div><div class="kpi-l">ARR (anual projetado)</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic blue">👤</div></div><div class="kpi-v">${eur(m.arpu)}</div><div class="kpi-l">ARPU</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic dark">📈</div></div><div class="kpi-v">${eur(m.mrr)}</div><div class="kpi-l">MRR atual</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><div><div class="card-title">Evolução do MRR</div><div class="card-sub">Mensal recorrente</div></div></div><div class="chart-bars">${bars}</div></div>

async function renderChurn(){

    </div>
    <div class="card"><div class="card-h"><div><div class="card-title">Alertas que precisam de atenção</div><div class="card-sub">Trials a expirar, risco de churn e cancelamentos</div></div></div>${alerts}</div>`;

async function renderActivity(){
  const acts=(DATA.activity||[]).map(a=>{const cls=a.type==='green'?'blue':a.type==='red'?'red':a.type==='blue'?'blue':'warn';const bg=a.type==='gold'?'style="background:var(--accBg)"':a.type==='green'?'style="background:var(--greenBg)"':'';return `<div class="alert-item"><div class="alert-ic ${cls}" ${bg}>${a.icon}</div><div style="flex:1"><div class="alert-t" style="font-weight:500">${a.txt}</div></div><div class="alert-time">${a.time}</div></div>`;}).join('');
  document.getElementById('page-activity').innerHTML=`<div class="card"><div class="card-h"><div class="card-title">Linha temporal de atividade</div></div>${acts}</div>`;
}
